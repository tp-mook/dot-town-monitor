<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドット町モニター（UI試作）</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9d8; --panel:#fffdf6; --ink:#2b2118; --muted:#7a6e5d; --line:#d8cfb8;
  --accent:#3a7d44; --danger:#c8402f; --chip:#f1ead6; --grass:#7cbf55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:13px}
.dot{font-family:"DotGothic16",monospace}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:3px solid var(--ink)}
.logo{display:flex;align-items:center;gap:8px}
.logo canvas{width:27px;height:36px;image-rendering:pixelated}
.logo .name{font-size:19px;line-height:1.1}
.logo .site{color:var(--muted);font-size:11px}
.now{margin:0 auto;display:flex;align-items:baseline;gap:6px;font-size:14px}
.now b{font-size:34px;line-height:1;color:var(--accent)}
.now .sub{color:var(--muted);font-size:12px;margin-left:8px}
.clock{font-size:22px}
.date{color:var(--muted);font-size:12px;margin-right:4px}
.seg{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}

main{display:grid;grid-template-columns:1fr 310px;min-height:0}
#stageWrap{position:relative;min-height:0;background:var(--grass);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:3px solid var(--ink);background:var(--panel);overflow:auto;padding:10px 12px 20px}
aside h3{font-family:"DotGothic16";font-weight:normal;font-size:14px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
aside h3:first-child{margin-top:2px}
aside h3 small{font-family:inherit;color:var(--muted);font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--chip);border-radius:6px;padding:6px 8px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-family:"DotGothic16";font-size:20px}
.stat.warn .v{color:var(--danger)}
ol.rank{margin:0;padding:0;list-style:none}
ol.rank li{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
ol.rank .n{font-family:"DotGothic16";width:16px;color:var(--muted)}
ol.rank .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.rank .c{font-family:"DotGothic16"}
.bar{height:4px;background:var(--accent);border-radius:2px;margin-top:2px}
.sus{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sus .tag{font-size:11px;padding:1px 6px;border-radius:3px;background:#f6d9d3;color:var(--danger);font-weight:bold;white-space:nowrap}
.sus .tag.urgent{background:var(--danger);color:#fff}
.sus .ip{flex:1;font-family:"DotGothic16";font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sus .ip small{display:block;font-family:inherit;color:var(--muted);font-size:10px}
.sus button{border:2px solid var(--danger);background:#fff;color:var(--danger);border-radius:4px;font:inherit;font-size:11px;padding:2px 6px;cursor:pointer}
.sus button:hover{background:var(--danger);color:#fff}
.sus.banned{opacity:.45}
.sus.banned button{display:none}
.empty{color:var(--muted);font-size:12px;padding:4px 0}
.kfilter{display:flex;gap:4px;margin-bottom:4px}
.kfilter button{border:2px solid var(--ink);background:var(--panel);border-radius:4px;font:inherit;font-size:11px;padding:1px 8px;cursor:pointer}
.kfilter button.on{background:var(--ink);color:#fff}
.khead,.krow{display:grid;grid-template-columns:20px 1fr 46px 54px;gap:6px;align-items:center}
.khead{font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px}
.khead span:nth-child(n+3),.krow span:nth-child(n+3){text-align:right}
.krow{padding:3px 2px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:12px}
.krow:hover{background:var(--chip)}
.krow.sel{background:#fff3b0}
.krow img{width:12px;height:16px;image-rendering:pixelated}
.krow .kn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .kn small{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow span:nth-child(n+3){font-family:"DotGothic16"}
.krow.bad .kn{color:var(--danger)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px}
.legend canvas{width:18px;height:24px;image-rendering:pixelated;flex:none}
ul.log{list-style:none;margin:0;padding:0;font-size:12px}
ul.log li{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
ul.log time{font-family:"DotGothic16";color:var(--muted);flex:none}
ul.log li.bad{color:var(--danger)}
ul.log li.new{animation:flash 1.2s}
@keyframes flash{from{background:#fff3b0}to{background:transparent}}

footer{display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--panel);border-top:3px solid var(--ink)}
footer .lbl{font-size:12px;color:var(--muted)}
#timeline{flex:1;height:38px;min-width:120px}

.pop{position:absolute;z-index:5;min-width:210px;max-width:270px;background:var(--panel);border:3px solid var(--ink);border-radius:6px;
  padding:8px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.25);font-size:12px;display:none}
.pop h4{margin:0 0 4px;font-family:"DotGothic16";font-weight:normal;font-size:15px}
.pop .meta{color:var(--muted);margin-bottom:6px}
.pop .route{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pop .route span{background:var(--chip);border-radius:3px;padding:1px 5px}
.pop .route i{font-style:normal;color:var(--muted)}
.pop table{border-collapse:collapse;width:100%}
.pop td{padding:2px 0}
.pop td:last-child{text-align:right;font-family:"DotGothic16"}
.pop{max-width:300px;min-width:240px;max-height:calc(100% - 12px);overflow:auto}
.pop table.nums td{border-bottom:1px dashed var(--line);padding:3px 0}
.pop table.nums td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
.pop table.nums td:last-child{font-family:inherit;font-weight:bold}
.pop .pages{max-height:150px;overflow:auto}
.pop .pl{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:2px 0}
.pop .pl em{font-style:normal;font-size:10px;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px}
.pop .pd{font-family:"DotGothic16"}
.pop .pb{grid-column:1/3;height:3px;background:#8dbf7a;border-radius:2px}
.pop .pl.next{display:block;color:var(--muted)}
.pop .x{position:absolute;right:6px;top:2px;cursor:pointer;color:var(--muted);font-size:16px}
.pop .ban{margin-top:6px;width:100%;border:2px solid var(--danger);background:var(--danger);color:#fff;border-radius:4px;padding:4px;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;
  font-family:"DotGothic16";opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

@media (max-width:900px){
  .app{height:auto}
  header{flex-wrap:wrap}
  .now{order:3;width:100%;justify-content:center}
  main{grid-template-columns:1fr}
  #stageWrap{height:58vw;min-height:260px}
  aside{border-left:0;border-top:3px solid var(--ink)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <canvas id="logo" width="9" height="12"></canvas>
      <div><div class="name dot">ドット町モニター</div><div class="site">https://www.example.co.jp/</div></div>
    </div>
    <div class="now dot">いま <b id="nowCount">0</b> 人が見ています<span class="sub" id="nowRobots">ロボット 0</span></div>
    <div class="date" id="date"></div>
    <div class="clock dot" id="clock">--:--</div>
    <div class="seg" id="viewSeg"><button class="on" data-v="town">町</button><button data-v="board">掲示板</button><button data-v="settings">設定</button></div>
    <div class="seg" id="skySeg"><button class="on" data-s="day">昼</button><button data-s="night">夜</button></div>
  </header>

  <main>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div class="pop" id="pop"><span class="x" id="popX">×</span><div id="popBody"></div></div>
    </div>
    <aside>
      <h3>きょうのまとめ <small id="sumDate"></small></h3>
      <div class="stats">
        <div class="stat"><div class="k">来た人</div><div class="v" id="sHumans">0</div></div>
        <div class="stat"><div class="k">見られたページ</div><div class="v" id="sViews">0</div></div>
        <div class="stat"><div class="k">ロボット</div><div class="v" id="sBots">0</div></div>
        <div class="stat warn"><div class="k">攻撃の疑い</div><div class="v" id="sAttacks">0</div></div>
      </div>

      <h3>人気のページ <small>きょう</small></h3>
      <ol class="rank" id="rank"></ol>

      <h3>要注意の相手 <small id="susCount"></small></h3>
      <div id="susList"><div class="empty">いまのところいません</div></div>

      <h3>いまいる小人 <small id="kobitoCount"></small></h3>
      <div class="kfilter" id="kFilter"><button class="on" data-k="human">人</button><button data-k="bot">ロボット・要注意</button></div>
      <div class="khead"><span></span><span>名前</span><span>ページ</span><span>滞在</span></div>
      <div id="kobitoList"></div>

      <h3>小人の見かた</h3>
      <div class="legend" id="legend"></div>

      <h3>できごと</h3>
      <ul class="log" id="log"></ul>
    </aside>
  </main>

  <footer>
    <span class="lbl">再生</span>
    <div class="seg" id="speedSeg"><button class="on" data-x="1">等速</button><button data-x="3">3倍</button><button data-x="10">10倍</button></div>
    <canvas id="timeline"></canvas>
    <div class="seg"><button class="on">きょう</button><button>7日</button><button>期間</button></div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 町の大きさ（ドット単位） =====
const W = 480, H = 270;
const $ = id => document.getElementById(id);
const R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const rand = (a, b) => a + R() * (b - a);
function seeded(s){ return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ===== ドット絵スプライト =====
function spr(rows, pal){
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
  }));
  return c;
}
const INK = '#2b2118';
const PERSON = ["....k....","...khk...","...khk...","..khhhk..",".khhhhhk.","kkkkkkkkk","..ksssk..","..kesek..","..ksssk..",".kccccck.",".kccccck."];
const LEGS = ["..kk.kk..",".kk...kk."];
const ROBOT = ["....r....","....k....",".kkkkkkk.",".kgggggk.",".kgcgcgk.",".kgggggk.",".kkkkkkk.","..kgggk..",".kgggggk.",".kgggggk."];
const HOOD = ["...kkk...","..krrrk..",".krrrrrk.",".krdddrk.",".krydyrk.",".krdddrk.","kkrrrrrkk","krrrrrrrk",".krrrrrk.",".krrrrrk.",".kkkkkkk."];
const ENVELOPE = ["kkkkkkk","kkwwwkk","kwkwkwk","kwwkwwk","kkkkkkk"];
const TREE = ["...kkkkk...","..kGGgggk..",".kGGggggdk.","kGgggggggdk","kggggggggdk","kgggggggddk",".kgggggddk.","..kkdddkk..","....kbk....","....kbk....","...kkbkk..."];
const HOUSE = ["......kkkk......",".....kRRRRk.....","....kRRRRRRk....","...kRRRRRRRRk...","..kRRRRRRRRRRk..",".kRRRRRRRRRRRRk.","kkkkkkkkkkkkkkkk",".kwwwwwwwwwwwwk.",".kwbbwwwwwwbbwk.",".kwbbwwkkwwbbwk.",".kwwwwkddkwwwwk.",".kwwwwkddkwwwwk.",".kwwwwkddkwwwwk.",".kkkkkkkkkkkkkk."];
const MAILBOX = [".kkk.","kRRRk","kRwRk","kRRRk",".kbk.",".kbk.",".kbk."];

const sprCache = {};
function personSpr(hat, clothes, f){
  const key = hat + clothes + f;
  return sprCache[key] ||= spr([...PERSON, LEGS[f]], {k:INK, h:hat, s:'#f6c9a0', e:INK, c:clothes});
}
function robotSpr(body, eye, f){
  const key = 'r' + body + f;
  return sprCache[key] ||= spr([...ROBOT, LEGS[f]], {k:INK, g:body, c:eye, r:'#e33'});
}
function hoodSpr(f){
  return sprCache['hood' + f] ||= spr([...HOOD, LEGS[f]], {k:INK, r:'#c8302a', d:'#3a1a1a', y:'#ffe14a'});
}
const envSpr = spr(ENVELOPE, {k:INK, w:'#fff'});
const treeSpr = spr(TREE, {k:'#264020', G:'#9be070', g:'#5aa83c', d:'#3d7d2a', b:'#7a4a24'});
const houseSpr = roof => sprCache['h' + roof] ||= spr(HOUSE, {k:INK, R:roof, w:'#f7efd9', b:'#7ec8f0', d:'#8a5a2b'});
const mailSpr = spr(MAILBOX, {k:INK, R:'#d9443a', w:'#fff', b:'#6b4a2a'});

// 来訪元（帽子の色）
const SOURCES = [
  {key:'search', label:'検索から',      color:'#3b6fd6', w:5},
  {key:'direct', label:'直接・ブックマーク', color:'#3aa04a', w:2},
  {key:'ai',     label:'AIチャットから',  color:'#9b59d0', w:1.5},
  {key:'sns',    label:'SNSから',       color:'#e8a33a', w:1},
];
const CLOTHES = '#f4f1e8', RETURN_CLOTHES = '#f08a3c';

// ===== 町のつくり =====
const ZONES = [
  {name:'会社案内',   x:8,   y:58,  w:104, h:84},
  {name:'ブログ',     x:130, y:58,  w:222, h:84},
  {name:'お問い合わせ', x:370, y:58,  w:102, h:84},
  {name:'採用',       x:8,   y:164, w:104, h:98},
  {name:'サービス',   x:130, y:164, w:222, h:98},
  {name:'管理画面',   x:370, y:164, w:102, h:50, fence:true},
];
const ROOFS = ['#d9534f','#4a7fd4','#e38b2c','#5aa65a','#8e5cc4','#3aa0a0'];
let hid = 0;
const H_ = (name, path, x, y, opt={}) => ({id:hid++, name, path, x, y, type:'house', roof:ROOFS[hid % ROOFS.length],
  w:16, h:14, door:{x:x+8, y:y+15}, viewers:0, total:0, next:{}, ...opt});
const HOUSES = [
  H_('トップページ', '/', 225, 8, {type:'mansion', w:30, h:28, door:{x:240, y:37}}),
  H_('会社概要', '/company/', 22, 76), H_('代表あいさつ', '/company/message', 70, 76),
  H_('アクセス', '/company/access', 22, 114), H_('沿革', '/company/history', 70, 114),
  H_('ブログ一覧', '/blog/', 146, 76), H_('生成AI活用術', '/blog/ai-tips', 198, 76),
  H_('補助金まとめ', '/blog/subsidy', 250, 76), H_('導入事例A社', '/blog/case-a', 302, 76),
  H_('DX入門', '/blog/dx', 146, 114), H_('社長日記', '/blog/diary', 198, 114),
  H_('Excel自動化', '/blog/excel', 250, 114), H_('セミナー報告', '/blog/seminar', 302, 114),
  H_('お問い合わせ', '/contact/', 384, 76, {type:'form', roof:'#d9443a'}),
  H_('予約CGI', '/cgi-bin/reserve.cgi', 436, 76, {type:'cgi', roof:'#7d7d86'}),
  H_('資料ダウンロード', '/download/', 410, 114),
  H_('採用情報', '/recruit/', 22, 180), H_('募集要項', '/recruit/jobs', 70, 180), H_('社員の声', '/recruit/voice', 46, 220),
  H_('サービス一覧', '/service/', 146, 180), H_('AI研修', '/service/ai-training', 198, 180),
  H_('DX支援', '/service/dx', 250, 180), H_('Web制作', '/service/web', 302, 180),
  H_('業務改善', '/service/kaizen', 172, 220), H_('料金', '/service/price', 276, 220),
  H_('ログイン画面', '/wp-login.php', 412, 182, {type:'admin', roof:'#4a4a55'}),
  H_('迷子の穴', '（存在しないページ）', 396, 230, {type:'pit', w:24, h:12, door:{x:408, y:244}}),
];
const byType = t => HOUSES.find(h => h.type === t);
const TOP = byType('mansion'), FORM = byType('form'), ADMIN = byType('admin'), PIT = byType('pit');
const PAGES = HOUSES.filter(h => !['admin','pit','cgi'].includes(h.type));
const GATE = {x:6, y:6, door:{x:19, y:32}};
const ROADS = [
  {x:0, y:44, w:W, h:7}, {x:0, y:148, w:W, h:8},
  {x:117, y:44, w:8, h:H-44}, {x:358, y:44, w:8, h:H-44}, {x:237, y:34, w:6, h:12},
  {x:16, y:28, w:6, h:18},
];
const roadY = y => y < 100 ? 47 : 152;
function route(a, b){
  const ra = roadY(a.y), rb = roadY(b.y);
  if (ra === rb) return [{x:a.x, y:ra}, {x:b.x, y:ra}, {x:b.x, y:b.y}];
  const vx = Math.abs((a.x + b.x) / 2 - 121) < Math.abs((a.x + b.x) / 2 - 362) ? 121 : 362;
  return [{x:a.x, y:ra}, {x:vx, y:ra}, {x:vx, y:rb}, {x:b.x, y:rb}, {x:b.x, y:b.y}];
}

// ===== 背景（静止部分）を一度だけ描く =====
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const TREES = [];
(function drawBackground(){
  const g = bg.getContext('2d'), r = seeded(7);
  g.fillStyle = '#7cbf55'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { g.fillStyle = r() < .5 ? '#6fb04a' : '#8acb62'; g.fillRect(r()*W|0, r()*H|0, 1, 1); }
  for (const z of ZONES) {
    g.fillStyle = '#9fd47c'; g.fillRect(z.x, z.y, z.w, z.h);
    g.fillStyle = '#5c9a3e';
    g.fillRect(z.x, z.y, z.w, 1); g.fillRect(z.x, z.y + z.h - 1, z.w, 1);
    g.fillRect(z.x, z.y, 1, z.h); g.fillRect(z.x + z.w - 1, z.y, 1, z.h);
    if (z.fence) {
      g.fillStyle = '#8a5a2b';
      for (let x = z.x; x < z.x + z.w; x += 3) { g.fillRect(x, z.y - 2, 1, 4); g.fillRect(x, z.y + z.h - 2, 1, 4); }
      for (let y = z.y; y < z.y + z.h; y += 3) { g.fillRect(z.x - 1, y, 3, 1); g.fillRect(z.x + z.w - 2, y, 3, 1); }
    }
  }
  for (const rd of ROADS) {
    g.fillStyle = '#e6d3a1'; g.fillRect(rd.x, rd.y, rd.w, rd.h);
    g.fillStyle = '#d6bf86';
    for (let i = 0; i < rd.w * rd.h / 14; i++) g.fillRect(rd.x + r()*rd.w|0, rd.y + r()*rd.h|0, 1, 1);
  }
  // 花
  for (let i = 0; i < 140; i++) {
    const x = r()*W|0, y = r()*H|0;
    if (blocked(x, y, 1)) continue;
    g.fillStyle = ['#fff','#ffd84a','#ff7a8a'][i % 3]; g.fillRect(x, y, 1, 1);
  }
  // 木
  const tr = seeded(42);
  for (let i = 0; i < 400; i++) {
    const x = tr()*(W-11)|0, y = tr()*(H-11)|0;
    if (blocked(x, y, 11, 11)) continue;
    g.drawImage(treeSpr, x, y);
    TREES.push({x, y});
  }
  // 入口の門
  const gx = GATE.x, gy = GATE.y;
  g.fillStyle = INK; g.fillRect(gx, gy + 3, 26, 5); g.fillStyle = '#b0503a'; g.fillRect(gx + 1, gy + 4, 24, 3);
  for (const px of [gx + 2, gx + 20]) { g.fillStyle = INK; g.fillRect(px, gy + 8, 4, 16); g.fillStyle = '#a9a39a'; g.fillRect(px + 1, gy + 8, 2, 15); }
  // 家
  for (const h of HOUSES) {
    if (h.type === 'mansion') drawMansion(g, h.x, h.y);
    else if (h.type === 'pit') drawPit(g, h.x, h.y);
    else {
      g.drawImage(houseSpr(h.roof), h.x, h.y);

    box.appendChild(row);
  }
  if (live.length > 12) box.insertAdjacentHTML('beforeend', `<div class="empty">ほか ${live.length - 12}人</div>`);
}
function renderSuspects(){
  const box = $('susList');
  $('susCount').textContent = suspects.length ? `${suspects.filter(s => !s.banned).length}件` : '';
  if (!suspects.length) { box.innerHTML = '<div class="empty">いまのところいません</div>'; return; }
  box.innerHTML = '';
  suspects.slice(0, 8).forEach(s => {
    const row = document.createElement('div');
    row.className = 'sus' + (s.banned ? ' banned' : '');
    row.innerHTML = `<span class="tag ${s.tag === '侵入?' ? 'urgent' : ''}">${s.banned ? '締め出し済' : s.tag}</span>
      <span class="ip">${s.ip}<small>${s.first}〜 ${s.hits}回</small></span><button>締め出す</button>`;
    row.querySelector('button').onclick = () => ban(s);
    row.onclick = e => { if (e.target.tagName !== 'BUTTON' && !s.agent.gone && agents.includes(s.agent)) openAgent(s.agent); };
    box.appendChild(row);
  });
}
function ban(s){
  if (s.banned) return;
  s.banned = true;
  const a = s.agent;
  if (agents.includes(a) && !a.gone) {
    if (a.at) { a.at.viewers--; a.at = null; }
    a.gone = simS(); puffs.push({x:a.x, y:a.y, t:simS()});
  }
  if (selected === a) closePop();
  log(`${s.ip} を締め出しました（以後の接続を拒否）`);
  renderSuspects();
}

const tl = $('timeline'), tg = tl.getContext('2d');
function drawTimeline(){
  const r = tl.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  tl.width = Math.round(r.width * d); tl.height = Math.round(r.height * d);
  const w = tl.width, h = tl.height, bw = w / 24, cur = new Date(simMs).getHours();
  const max = Math.max(10, ...hourly.filter(Boolean).map(v => v.humans + v.bots));
  tg.clearRect(0, 0, w, h);
  tg.font = `${10 * d}px "DotGothic16", sans-serif`; tg.textAlign = 'center'; tg.textBaseline = 'bottom';
  hourly.forEach((v, i) => {
    const x = i * bw + 1;
    if (i % 3 === 0) { tg.fillStyle = '#7a6e5d'; tg.fillText(i, x + bw / 2, h); }
    if (!v) return;
    const usable = h - 12 * d;
    const hh = v.humans / max * usable, hb = v.bots / max * usable;
    tg.fillStyle = i === cur ? '#3a7d44' : '#8dbf7a'; tg.fillRect(x, usable - hh, bw - 2, hh);
    tg.fillStyle = '#c9c0ab'; tg.fillRect(x, usable - hh - hb, bw - 2, hb);
  });
  const mx = (cur + new Date(simMs).getMinutes() / 60) * bw;
  tg.fillStyle = '#c8402f'; tg.fillRect(mx, 0, 2 * d, h - 12 * d);
}

// ===== クリックで詳細 =====
const pop = $('pop');
function toWorld(e){ const r = cv.getBoundingClientRect(); return {x: ((e.clientX - r.left) * dpr - ox) / S, y: ((e.clientY - r.top) * dpr - oy) / S}; }
cv.addEventListener('mousemove', e => {
  const p = toWorld(e);
  cv.style.cursor = hitAgent(p) || hitHouse(p) ? 'pointer' : 'default';
});
cv.addEventListener('click', e => {
  const p = toWorld(e), a = hitAgent(p), h = !a && hitHouse(p);
  if (a) openAgent(a, e); else if (h) openHouse(h, e); else closePop();
});
const hitAgent = p => agents.filter(a => !a.gone && Math.abs(a.x - p.x) < 5 && p.y > a.y - 12 && p.y < a.y + 2).sort((x, y) => y.y - x.y)[0];
const hitHouse = p => HOUSES.find(h => p.x >= h.x - 1 && p.x <= h.x + h.w + 1 && p.y >= h.y - 1 && p.y <= h.y + h.h + 1);
let popKind = null, popEvt = null;
function placePop(e){
  const wrap = $('stageWrap').getBoundingClientRect();
  let x, y;
  if (e) { x = e.clientX - wrap.left + 14; y = e.clientY - wrap.top + 14; popEvt = {x, y}; }
  else ({x, y} = popEvt || {x:20, y:20});
  pop.style.display = 'block';
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(6, Math.min(x, wrap.width - pw - 6)) + 'px';
  pop.style.top = Math.max(6, Math.min(y, wrap.height - ph - 6)) + 'px';
}
function openAgent(a, e){
  selected = a; selectedHouse = null; popKind = 'agent';
  if (!e) {
    // 一覧から選んだときは、町の中のその小人の横に出す
    const r = cv.getBoundingClientRect();
    e = {clientX: r.left + (ox + a.x * S) / dpr, clientY: r.top + (oy + (a.y - 12) * S) / dpr};
  }
  fillAgentPop(); placePop(e); renderKobito();
}
function fillAgentPop(){
  const a = selected;
  const kindLine = a.kind === 'human'
    ? `${a.src.label} ・ ${a.mobile ? 'スマホ' : 'パソコン'} ・ ${a.returning ? 'また来た人' : 'はじめての人'}`
    : a.kind === 'crawler' ? `検索・AIの自動巡回（人数に数えない）`
    : a.kind === 'spam' ? 'お問い合わせフォームへの自動送信' : `攻撃の疑い ・ ${a.tag}`;
  const nextH = a.route[a.step] && a.state !== 'leave' ? a.route[a.step] : null;
  const stayed = simS() - a.born;
  const rows = numbersOf(a, stayed).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  // ページごとの滞在時間（見ている途中のページは現在までの時間）
  const durs = a.pageLog.map(p => ({h:p.h, d:p.dur ?? simS() - p.t, now:p.dur == null}));
  const maxD = Math.max(1, ...durs.map(p => p.d));
  const pages = durs.map(p => `<div class="pl"><span class="pn">${p.h.name}${p.now ? ' <em>見ている</em>' : ''}</span><span class="pd">${fmt(p.d)}</span>
    <div class="pb" style="width:${(p.d / maxD * 100).toFixed(0)}%"></div></div>`).join('');
  $('popBody').innerHTML = `<h4>${nameOf(a)}</h4><div class="meta">${kindLine}<br>${a.ip}</div>
    <table class="nums">${rows}</table>
    <div class="meta" style="margin:8px 0 3px">${a.kind === 'human' ? '見たページと滞在時間' : '訪れた場所'}</div>
    <div class="pages">${pages || '<i>（移動中）</i>'}${a.state === 'walk' && nextH ? `<div class="pl next">→ ${nextH.name}へ移動中</div>` : ''}</div>
    ${a.kind === 'attacker' && !a.suspect.banned ? '<button class="ban" id="popBan">この相手を締め出す</button>' : ''}`;
  const b = $('popBan'); if (b) b.onclick = () => ban(a.suspect);
}
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  return sec < 60 ? `${sec}秒` : `${sec / 60 | 0}分${String(sec % 60).padStart(2, '0')}秒`;
}
function numbersOf(a, stayed){
  if (a.kind === 'human') {
    const done = a.pageLog.filter(p => p.dur != null);
    const avg = done.length ? done.reduce((s, p) => s + p.dur, 0) / done.length : null;
    return [
      ['サイトにいる時間', fmt(stayed)],
      ['見たページ', `${a.pageLog.length}ページ`],
      ['1ページあたり', avg == null ? '—' : fmt(avg)],
      ['これまでの訪問', a.visits === 1 ? 'はじめて' : `${a.visits}回目`],
      [a.src.key === 'search' ? '検索した言葉' : a.src.key === 'direct' ? '来る前の場所' : '来る前のサービス', a.referrer],
      ['端末', a.browser],
      ['見つからないページ', `${a.notFound}回`],
    ];
  }
  if (a.kind === 'attacker') return [
    ['要求の回数', `${a.reqs}回`],
    ['見つからないページ', `${a.notFound}回`],
    ['ログイン試行', `${a.loginTries}回`],
    ['名乗った名前', `${a.uaNames}種類`],
    ['要求の速さ', `${(a.reqs / Math.max(stayed, 1) * 60).toFixed(0)}回/分`],
    ['滞在時間', fmt(stayed)],
  ];
  return [
    ['名前', a.kind === 'crawler' ? a.bot : '（偽装したブラウザ名）'],
    ['要求の回数', `${a.reqs}回`],
    ['巡回したページ', `${new Set(a.history).size}ページ`],
    ...(a.kind === 'spam' ? [['フォーム送信', a.letter ? '0回（向かっている）' : '1回']] : []),
    ['滞在時間', fmt(stayed)],
  ];
}
function openHouse(h, e){
  selectedHouse = h; selected = null; popKind = 'house';
  fillHousePop(); placePop(e);
}
function fillHousePop(){
  const h = selectedHouse;
  const next = Object.entries(h.next).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $('popBody').innerHTML = `<h4>${h.name}</h4><div class="meta">${h.path}</div>
    <table><tr><td>いま見ている人</td><td>${agents.filter(a => a.at === h && a.kind === 'human').length}</td></tr>
    <tr><td>きょう見た人</td><td>${h.total}</td></tr></table>
    ${next.length ? `<div class="meta" style="margin:6px 0 2px">次に行ったページ</div>${next.map(([n, c]) => `<div class="route"><span>${n}</span><i>${c}人</i></div>`).join('')}` : ''}`;
}
function closePop(){ pop.style.display = 'none'; selected = null; selectedHouse = null; popKind = null; }
$('popX').onclick = closePop;

// ===== 操作 =====
function seg(id, fn){ $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b); }); }
seg('speedSeg', b => speed = +b.dataset.x);
seg('kFilter', b => { kFilter = b.dataset.k; renderKobito(); });
seg('skySeg', b => night = b.dataset.s === 'night');
seg('viewSeg', b => { if (b.dataset.v !== 'town') { toast('この画面は次の段階で作ります'); setTimeout(() => $('viewSeg').firstElementChild.click(), 600); } });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }

// 凡例とロゴ
(function(){
  const items = [
    [personSpr(SOURCES[0].color, CLOTHES, 0), '検索から来た人'],
    [personSpr(SOURCES[1].color, CLOTHES, 0), '直接来た人'],
    [personSpr(SOURCES[2].color, CLOTHES, 0), 'AIチャットから'],
    [personSpr(SOURCES[3].color, CLOTHES, 0), 'SNSから'],
    [personSpr(SOURCES[0].color, RETURN_CLOTHES, 0), 'また来た人（服）'],
    [robotSpr('#a9bccf', '#3cf', 0), 'クローラー'],
    [robotSpr('#e5c34a', '#e33', 0), '営業ロボット'],
    [hoodSpr(0), '攻撃の疑い'],
  ];
  const box = $('legend');
  for (const [s, t] of items) {
    const c = document.createElement('canvas'); c.width = 9; c.height = 12; c.getContext('2d').drawImage(s, 0, 0);
    const d = document.createElement('div'); d.append(c, t); box.appendChild(d);
  }
  $('logo').getContext('2d').drawImage(personSpr('#3b6fd6', CLOTHES, 0), 0, 0);
})();

// 最初から町に何人かいる状態にする
for (let i = 0; i < 9; i++) {
  const a = spawn('human');
  stats.humans--; curHour().humans--;
  const h = a.route[0], s = doorSpot(h, a);
  a.x = s.x; a.y = s.y; a.wp = []; arrive(a); a.stayUntil = simS() + rand(1, 8);
  a.born = a.pageLog[0].t = simS() - rand(5, 90);
}
for (let i = 0; i < 2; i++) { const a = spawn('crawler'); stats.bots--; const s = doorSpot(a.route[0]); a.x = s.x; a.y = s.y; a.wp = []; }
log('監視をはじめました（デモデータで動いています）');

resize();
let last = performance.now(), sideT = 0;
function loop(t){
  const real = Math.min(.1, (t - last) / 1000); last = t;
  const dt = real * speed;
  simMs += dt * 1000;
  update(dt); render();
  sideT += real;
  if (sideT > .5) { sideT = 0; renderSide(); if (popKind === 'agent' && selected) fillAgentPop(); if (popKind === 'house') fillHousePop(); }
  requestAnimationFrame(loop);
}
renderSide(); renderSuspects();
requestAnimationFrame(loop);
</script>
