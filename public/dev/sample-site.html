<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>トップ | 計測タグ確認用のサイト</title>
<style>
body{font-family:sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.7}
nav a{margin-right:12px}
form{margin-top:16px;display:none}
</style>
</head>
<body>
<p>計測タグ（/t.js）の動きを確かめるためのページです。リンクは Wix と同じく、読み込み直さずに URL だけを切り替えます。</p>
<nav>
  <a href="/">トップ</a>
  <a href="/会社概要">会社概要</a>
  <a href="/ledビジョン販売">LEDビジョン販売</a>
  <a href="/blog">ブログ</a>
  <a href="/お問い合わせ">お問い合わせ</a>
</nav>
<h1 id="h"></h1>
<!-- Wix のフォームと同じく、送信ボタンは type=button。空なら入力エラー、入っていれば内容を消して完了の文言を出す -->
<form id="f"><input id="name" placeholder="お名前" aria-invalid="false"> <button type="button" id="send">送信</button><p id="msg"></p></form>
<script>
  const show = p => {
    const name = p === '/' ? 'トップ' : decodeURIComponent(p).slice(1);
    document.title = name + ' | 計測タグ確認用のサイト';
    document.getElementById('h').textContent = name;
    document.getElementById('f').style.display = name === 'お問い合わせ' ? 'block' : 'none';
  };
  document.querySelector('nav').addEventListener('click', e => {
    if (e.target.tagName !== 'A') return;
    e.preventDefault();
    const p = e.target.getAttribute('href');
    history.pushState(null, '', p);
    show(p);
  });
  addEventListener('popstate', () => show(location.pathname));
  document.getElementById('send').addEventListener('click', () => {
    const name = document.getElementById('name'), msg = document.getElementById('msg');
    setTimeout(() => {
      if (!name.value) { name.setAttribute('aria-invalid', 'true'); msg.textContent = '必須項目です'; return; }
      name.setAttribute('aria-invalid', 'false'); name.value = ''; msg.textContent = '送信ありがとうございました';
    }, 800);
  });
  // 読み込み直すと404になるので、確認は最初の表示から続けて操作する
  history.replaceState(null, '', '/' + location.search);
  show('/');
</script>
<script src="/t.js" async></script>
</body>
</html>
