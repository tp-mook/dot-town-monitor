<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドット町モニター</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9d8; --panel:#fffdf6; --ink:#2b2118; --muted:#7a6e5d; --line:#d8cfb8;
  --accent:#3a7d44; --danger:#c8402f; --chip:#f1ead6; --grass:#7cbf55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:13px}
.dot{font-family:"DotGothic16",monospace}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:3px solid var(--ink)}
.logo{display:flex;align-items:center;gap:8px}
.logo canvas{width:27px;height:36px;image-rendering:pixelated}
.logo .name{font-size:19px;line-height:1.1}
.logo .site{color:var(--muted);font-size:11px}
.mode{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.mode.live{background:var(--accent);color:#fff}
.mode.down{background:var(--danger);color:#fff}
.now{margin:0 auto;display:flex;align-items:baseline;gap:6px;font-size:14px}
.now b{font-size:34px;line-height:1;color:var(--accent)}
.now .sub{color:var(--muted);font-size:12px;margin-left:8px}
.clock{font-size:22px}
.date{color:var(--muted);font-size:12px;margin-right:4px}
.seg{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.sel{border:2px solid var(--ink);border-radius:6px;background:var(--panel);font:inherit;padding:4px 6px;color:var(--ink)}

main{display:grid;grid-template-columns:1fr 310px;min-height:0}
#stageWrap{position:relative;min-height:0;background:var(--grass);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:3px solid var(--ink);background:var(--panel);overflow:auto;padding:10px 12px 20px}
aside h3{font-family:"DotGothic16";font-weight:normal;font-size:14px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
aside h3:first-child{margin-top:2px}
aside h3 small{font-family:inherit;color:var(--muted);font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--chip);border-radius:6px;padding:6px 8px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-family:"DotGothic16";font-size:20px}
.stat .v small{font-size:10px;color:var(--muted);font-family:inherit;display:block;line-height:1.3}
.stat.warn .v{color:var(--danger)}
ol.rank{margin:0;padding:0;list-style:none}
ol.rank li{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
ol.rank .n{font-family:"DotGothic16";width:16px;color:var(--muted)}
ol.rank .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.rank .c{font-family:"DotGothic16"}
.bar{height:4px;background:var(--accent);border-radius:2px;margin-top:2px}
.sus{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sus .tag{font-size:11px;padding:1px 6px;border-radius:3px;background:#f6d9d3;color:var(--danger);font-weight:bold;white-space:nowrap}
.sus .tag.urgent{background:var(--danger);color:#fff}
.sus .ip{flex:1;font-family:"DotGothic16";font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sus .ip small{display:block;font-family:inherit;color:var(--muted);font-size:10px}
.sus button{border:2px solid var(--danger);background:#fff;color:var(--danger);border-radius:4px;font:inherit;font-size:11px;padding:2px 6px;cursor:pointer}
.sus button:hover{background:var(--danger);color:#fff}
.sus.banned{opacity:.45}
.sus.banned button{display:none}
.empty{color:var(--muted);font-size:12px;padding:4px 0}
.kfilter{display:flex;gap:4px;margin-bottom:4px}
.kfilter button{border:2px solid var(--ink);background:var(--panel);border-radius:4px;font:inherit;font-size:11px;padding:1px 8px;cursor:pointer}
.kfilter button.on{background:var(--ink);color:#fff}
.khead,.krow{display:grid;grid-template-columns:20px 1fr 46px 54px;gap:6px;align-items:center}
.khead{font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px}
.khead span:nth-child(n+3),.krow span:nth-child(n+3){text-align:right}
.krow{padding:3px 2px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:12px}
.krow:hover{background:var(--chip)}
.krow.sel{background:#fff3b0}
.krow img{width:12px;height:16px;image-rendering:pixelated}
.krow .kn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .kn small{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow span:nth-child(n+3){font-family:"DotGothic16"}
.krow.bad .kn{color:var(--danger)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px}
.legend canvas{width:18px;height:24px;image-rendering:pixelated;flex:none}
ul.log{list-style:none;margin:0;padding:0;font-size:12px}
ul.log li{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
ul.log time{font-family:"DotGothic16";color:var(--muted);flex:none}
ul.log li.bad{color:var(--danger)}
ul.log li.good{color:var(--accent);font-weight:bold}
ul.log li.new{animation:flash 1.2s}
@keyframes flash{from{background:#fff3b0}to{background:transparent}}

footer{display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--panel);border-top:3px solid var(--ink)}
footer .lbl{font-size:12px;color:var(--muted)}
#timeline{flex:1;height:38px;min-width:120px}

.pop{position:absolute;z-index:5;min-width:240px;max-width:300px;max-height:calc(100% - 12px);overflow:auto;background:var(--panel);border:3px solid var(--ink);border-radius:6px;
  padding:8px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.25);font-size:12px;display:none}
.pop h4{margin:0 0 4px;font-family:"DotGothic16";font-weight:normal;font-size:15px;padding-right:14px}
.pop .meta{color:var(--muted);margin-bottom:6px}
.pop .route{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pop .route span{background:var(--chip);border-radius:3px;padding:1px 5px}
.pop .route i{font-style:normal;color:var(--muted)}
.pop table{border-collapse:collapse;width:100%}
.pop td{padding:2px 0}
.pop td:last-child{text-align:right;font-family:"DotGothic16"}
.pop table.nums td{border-bottom:1px dashed var(--line);padding:3px 0}
.pop table.nums td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
.pop table.nums td:last-child{font-family:inherit;font-weight:bold}
.pop .pages{max-height:150px;overflow:auto}
.pop .pl{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:2px 0}
.pop .pl em{font-style:normal;font-size:10px;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px}
.pop .pd{font-family:"DotGothic16"}
.pop .pb{grid-column:1/3;height:3px;background:#8dbf7a;border-radius:2px}
.pop .pl.next{display:block;color:var(--muted)}
.pop .x{position:absolute;right:6px;top:2px;cursor:pointer;color:var(--muted);font-size:16px}
.pop .ban{margin-top:6px;width:100%;border:2px solid var(--danger);background:var(--danger);color:#fff;border-radius:4px;padding:4px;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;
  font-family:"DotGothic16";opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;background:rgba(43,33,24,.55);display:none;align-items:center;justify-content:center;z-index:20}
.gate.on{display:flex}
.gate form{background:var(--panel);border:3px solid var(--ink);border-radius:8px;padding:18px 20px;width:min(320px,90vw);box-shadow:5px 5px 0 rgba(0,0,0,.3)}
.gate h2{font-family:"DotGothic16";font-weight:normal;margin:0 0 10px;font-size:18px}
.gate input{width:100%;font:inherit;padding:6px 8px;border:2px solid var(--ink);border-radius:4px}
.gate button{margin-top:10px;width:100%;font:inherit;padding:6px;border:0;border-radius:4px;background:var(--ink);color:#fff;cursor:pointer}
.gate .err{color:var(--danger);font-size:12px;min-height:1.2em;margin-top:6px}
.gate a{font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .app{height:auto}
  header{flex-wrap:wrap}
  .now{order:3;width:100%;justify-content:center}
  main{grid-template-columns:1fr}
  #stageWrap{height:58vw;min-height:260px}
  aside{border-left:0;border-top:3px solid var(--ink)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <canvas id="logo" width="9" height="12"></canvas>
      <div><div class="name dot">ドット町モニター<span class="mode" id="mode"></span></div><div class="site" id="siteUrl"></div></div>
    </div>
    <div class="now dot">いま <b id="nowCount">0</b> 人が見ています<span class="sub" id="nowRobots">ロボット 0</span></div>
    <div class="date" id="date"></div>
    <div class="clock dot" id="clock">--:--</div>
    <div class="seg" id="skySeg" title="空の色"><button data-v="auto">時刻</button><button data-v="day">昼</button><button data-v="evening">夕</button><button data-v="night">夜</button></div>
    <div class="seg" id="snowSeg" title="雪（自動は12〜2月）"><button data-v="auto">自動</button><button data-v="on">雪</button><button data-v="off">なし</button></div>
    <select id="seasonSel" class="sel" title="季節"><option value="auto">季節：自動</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option></select>
  </header>

  <main>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div class="pop" id="pop"><span class="x" id="popX">×</span><div id="popBody"></div></div>
    </div>
    <aside>
      <h3>きょうのまとめ <small id="sumDate"></small></h3>
      <div class="stats">
        <div class="stat"><div class="k">来た人</div><div class="v" id="sHumans">0</div></div>
        <div class="stat"><div class="k">見られたページ</div><div class="v" id="sViews">0</div></div>
        <div class="stat"><div class="k">ロボット</div><div class="v" id="sBots">0</div></div>
        <div class="stat warn"><div class="k">攻撃の疑い</div><div class="v" id="sAttacks">0</div></div>
      </div>

      <h3>人気のページ <small>きょう</small></h3>
      <ol class="rank" id="rank"></ol>

      <h3>要注意の相手 <small id="susCount"></small></h3>
      <div id="susList"><div class="empty">いまのところいません</div></div>

      <h3>いまいる小人 <small id="kobitoCount"></small></h3>
      <div class="kfilter" id="kFilter"><button class="on" data-k="human">人</button><button data-k="bot">ロボット・要注意</button></div>
      <div class="khead"><span></span><span>名前</span><span>ページ</span><span>滞在</span></div>
      <div id="kobitoList"></div>

      <h3>小人の見かた</h3>
      <div class="legend" id="legend"></div>

      <h3>できごと</h3>
      <ul class="log" id="log"></ul>
    </aside>
  </main>

  <footer>
    <span class="lbl" id="speedLbl">再生</span>
    <div class="seg" id="speedSeg"><button class="on" data-x="1">等速</button><button data-x="3">3倍</button><button data-x="10">10倍</button></div>
    <span class="lbl">きょうの訪問（1時間ごと）</span>
    <canvas id="timeline"></canvas>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate">
  <form id="gateForm">
    <h2>合言葉を入れてください</h2>
    <input id="gateKey" type="password" autocomplete="current-password" placeholder="合言葉">
    <button>町を見る</button>
    <div class="err" id="gateErr"></div>
    <a href="?demo">デモデータで見る</a>
  </form>
</div>

<script>
// ?demo を付けるとデモデータで動く。付けなければ収集サーバー（/api）のデータで動く
const DEMO = new URLSearchParams(location.search).has('demo');

// ===== 町の大きさ（ドット単位） =====
const W = 480, H = 270;
const $ = id => document.getElementById(id);
const R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const rand = (a, b) => a + R() * (b - a);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seeded(s){ return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ===== ドット絵スプライト =====
function spr(rows, pal){
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
  }));
  return c;
}
const INK = '#2b2118';
const PERSON = ["....k....","...khk...","...khk...","..khhhk..",".khhhhhk.","kkkkkkkkk","..ksssk..","..kesek..","..ksssk..",".kccccck.",".kccccck."];
const LEGS = ["..kk.kk..",".kk...kk."];
const ROBOT = ["....r....","....k....",".kkkkkkk.",".kgggggk.",".kgcgcgk.",".kgggggk.",".kkkkkkk.","..kgggk..",".kgggggk.",".kgggggk."];
const HOOD = ["...kkk...","..krrrk..",".krrrrrk.",".krdddrk.",".krydyrk.",".krdddrk.","kkrrrrrkk","krrrrrrrk",".krrrrrk.",".krrrrrk.",".kkkkkkk."];
const ENVELOPE = ["kkkkkkk","kkwwwkk","kwkwkwk","kwwkwwk","kkkkkkk"];
const TREE = ["...kkkkk...","..kGGgggk..",".kGGggggdk.","kGgggggggdk","kggggggggdk","kgggggggddk",".kgggggddk.","..kkdddkk..","....kbk....","....kbk....","...kkbkk..."];
const HOUSE = ["......kkkk......",".....kRRRRk.....","....kRRRRRRk....","...kRRRRRRRRk...","..kRRRRRRRRRRk..",".kRRRRRRRRRRRRk.","kkkkkkkkkkkkkkkk",".kwwwwwwwwwwwwk.",".kwbbwwwwwwbbwk.",".kwbbwwkkwwbbwk.",".kwwwwkddkwwwwk.",".kwwwwkddkwwwwk.",".kwwwwkddkwwwwk.",".kkkkkkkkkkkkkk."];
const MAILBOX = [".kkk.","kRRRk","kRwRk","kRRRk",".kbk.",".kbk.",".kbk."];

const sprCache = {};
function personSpr(hat, clothes, f){
  const key = hat + clothes + f;
  return sprCache[key] ||= spr([...PERSON, LEGS[f]], {k:INK, h:hat, s:'#f6c9a0', e:INK, c:clothes});
}
function robotSpr(body, eye, f){
  const key = 'r' + body + f;
  return sprCache[key] ||= spr([...ROBOT, LEGS[f]], {k:INK, g:body, c:eye, r:'#e33'});
}
function hoodSpr(f){
  return sprCache['hood' + f] ||= spr([...HOOD, LEGS[f]], {k:INK, r:'#c8302a', d:'#3a1a1a', y:'#ffe14a'});
}
const envSpr = spr(ENVELOPE, {k:INK, w:'#fff'});
// 木は季節で色を変える（G 明るい葉・g 葉・d 影）
const TREE_COLORS = {
  green:     ['#9be070', '#5aa83c', '#3d7d2a'],
  deep:      ['#7ccf55', '#3f9a32', '#2c6e24'],
  blossom:   ['#ffe0ec', '#f7a8c8', '#d97aa3'],
  orange:    ['#ffd36a', '#f0a030', '#c96a20'],
  red:       ['#ff9a7a', '#e0583a', '#a83a26'],
  evergreen: ['#7da866', '#3f6e3a', '#2a4f2a'],
  snowy:     ['#ffffff', '#4f8a3c', '#2f5f2a'],
};
const treeSpr = kind => sprCache['t' + kind] ||= spr(TREE, {k:'#264020', G:TREE_COLORS[kind][0], g:TREE_COLORS[kind][1], d:TREE_COLORS[kind][2], b:'#7a4a24'});
// 雪の日は屋根の上3段を白くする
const HOUSE_SNOW = HOUSE.map((r, j) => j >= 1 && j <= 3 ? r.replace(/R/g, 'S') : r);
const houseSpr = (roof, snow) => sprCache['h' + roof + (snow ? 's' : '')] ||= spr(snow ? HOUSE_SNOW : HOUSE, {k:INK, R:roof, S:'#f4f8ff', w:'#f7efd9', b:'#7ec8f0', d:'#8a5a2b'});
const mailSpr = spr(MAILBOX, {k:INK, R:'#d9443a', w:'#fff', b:'#6b4a2a'});

// 来訪元（帽子の色）
const SOURCES = [
  {key:'search', label:'検索から',        color:'#3b6fd6', w:5},
  {key:'direct', label:'直接・ブックマーク', color:'#3aa04a', w:2},
  {key:'ai',     label:'AIチャットから',   color:'#9b59d0', w:1.5},
  {key:'sns',    label:'SNSから',        color:'#e8a33a', w:1},
  {key:'other',  label:'ほかのサイトから',  color:'#2fa3a3', w:.6},
];
const srcByKey = k => SOURCES.find(s => s.key === k) || SOURCES[1];
const CLOTHES = '#f4f1e8', RETURN_CLOTHES = '#f08a3c';

// ===== 町のつくり =====
// 区画を置く場所。広い場所から順に、ページの多い区画を割り当てる
const SLOTS = [
  {x:130, y:58,  w:222, h:84, cols:4, rows:2, dx:52},
  {x:130, y:164, w:222, h:98, cols:4, rows:2, dx:52},
  {x:8,   y:58,  w:104, h:84, cols:2, rows:2, dx:48},
  {x:370, y:58,  w:102, h:84, cols:2, rows:2, dx:48},
  {x:8,   y:164, w:104, h:98, cols:2, rows:2, dx:48},
  {x:370, y:164, w:102, h:50, cols:2, rows:1, dx:48},
];
const ROOFS = ['#d9534f','#4a7fd4','#e38b2c','#5aa65a','#8e5cc4','#3aa0a0'];
const GATE = {x:6, y:6, door:{x:19, y:32}};
const ROADS = [
  {x:0, y:44, w:W, h:7}, {x:0, y:148, w:W, h:8},
  {x:117, y:44, w:8, h:H-44}, {x:358, y:44, w:8, h:H-44}, {x:237, y:34, w:6, h:12},
  {x:16, y:28, w:6, h:18},
];
let ZONES = [], HOUSES = [], PAGES = [];
let TOP, FORM, ADMIN, PIT, CGI;
const houseByPath = new Map();
let townInfo = null;

function mkHouse(name, path, x, y, opt = {}){
  return {name, path, paths: [path], x, y, type:'house', w:16, h:14, door:{x:x+8, y:y+15},
    viewers:0, total:0, next:{}, ...opt};
}
function setPos(h, x, y){
  h.x = x; h.y = y;
  h.door = h.type === 'pit' ? {x:x+12, y:y+14} : h.type === 'mansion' ? {x:x+15, y:y+29} : {x:x+8, y:y+15};
}

// zones: [{name, pages:[{path,title,form?,type?}], fence?}]  区画は SLOTS の順に置く
function layoutTown(zones, opts = {}){
  const old = new Map(HOUSES.map(h => [h.path, h]));
  const keep = (path, make) => { const h = old.get(path) || make(); return h; };
  HOUSES = []; ZONES = []; houseByPath.clear();
  TOP = keep('/', () => mkHouse('トップページ', '/', 0, 0, {type:'mansion', w:30, h:28}));
  TOP.name = opts.topTitle || 'トップページ';
  setPos(TOP, 225, 8); HOUSES.push(TOP);
  zones.slice(0, SLOTS.length).forEach((z, zi) => {
    const s = SLOTS[zi];
    ZONES.push({name:z.name, x:s.x, y:s.y, w:s.w, h:s.h, fence:z.fence});
    const cap = s.cols * s.rows;
    const list = z.pages.length > cap ? z.pages.slice(0, cap - 1) : z.pages;
    const rest = z.pages.length > cap ? z.pages.slice(cap - 1) : [];
    const place = (h, i) => {
      h.order = i;
      setPos(h,s.x + (s.cols === 4 ? 16 : 14) + (i % s.cols) * s.dx, s.y + 18 + (i / s.cols | 0) * 38);
      HOUSES.push(h);
    };
    list.forEach((p, i) => {
      const type = p.type || (p.form ? 'form' : 'house');
      const h = keep(p.path, () => mkHouse(p.title, p.path, 0, 0, {type,
        roof: type === 'form' ? '#d9443a' : type === 'admin' ? '#4a4a55' : type === 'cgi' ? '#7d7d86' : ROOFS[(zi * 3 + i) % ROOFS.length],
        // 町を見ている最中に新しいページが増えたら、工事から始める

const roadY = y => y < 100 ? 47 : 152;
function route(a, b){
  const ra = roadY(a.y), rb = roadY(b.y);
  if (ra === rb) return [{x:a.x, y:ra}, {x:b.x, y:ra}, {x:b.x, y:b.y}];
  const vx = Math.abs((a.x + b.x) / 2 - 121) < Math.abs((a.x + b.x) / 2 - 362) ? 121 : 362;
  return [{x:a.x, y:ra}, {x:vx, y:ra}, {x:vx, y:rb}, {x:b.x, y:rb}, {x:b.x, y:b.y}];
}

    g.fillStyle = G.edge;
    g.fillRect(z.x, z.y, z.w, 1); g.fillRect(z.x, z.y + z.h - 1, z.w, 1);
    g.fillRect(z.x, z.y, 1, z.h); g.fillRect(z.x + z.w - 1, z.y, 1, z.h);

      for (let y = z.y; y < z.y + z.h; y += 3) { g.fillRect(z.x - 1, y, 3, 1); g.fillRect(z.x + z.w - 2, y, 3, 1); }

function blocked(x, y, w = 1, h = 1){
  const hit = (r, m = 0) => x < r.x + r.w + m && x + w > r.x - m && y < r.y + r.h + m && y + h > r.y - m;

const BUILD_SECONDS = 7;
// 工事前の更地（背景に描く）
function drawPlot(g, h){
  g.fillStyle = '#8a6a44'; g.fillRect(h.x, h.y + 8, 16, 6);
  g.fillStyle = '#a5845a'; for (let i = 0; i < 10; i++) g.fillRect(h.x + (i * 7) % 16, h.y + 9 + (i * 3) % 5, 1, 1);
  g.fillStyle = '#e8d6a6'; for (const sx of [0, 15]) g.fillRect(h.x + sx, h.y + 6, 1, 8);
}
// 工事の進み具合を描く（動く部分）。終わったら家を背景に描き直す
function drawBuilding(g, h, now){
  const k = Math.min(1, (now - h.building.start) / BUILD_SECONDS);
  if (k >= 1) {
    h.building = null; h.builtAt = now;
    drawBackground();
    log(`新しい家が建ちました：「${h.name}」`, 'good');
    toast(`🏠 新しい家が建ちました：${h.name}`);
    return;
  }
  // 下から少しずつ家が立ち上がる
  const sp = houseSpr(h.roof, drawnGround === 'snow'), rows = Math.max(1, Math.round(14 * Math.max(0, (k - .25) / .75)));
  if (k > .25) g.drawImage(sp, 0, 14 - rows, 16, rows, h.x, h.y + 14 - rows, 16, rows);
  // 足場
  g.fillStyle = '#b0844e';
  for (const sx of [-1, 16]) g.fillRect(h.x + sx, h.y + 1, 1, 13);
  for (let yy = h.y + 3; yy < h.y + 14; yy += 4) g.fillRect(h.x - 1, yy, 18, 1);
  // 大工さん（黄色いヘルメット）がトンカチをふる
  // now は大きな数なので | 0 ではなく Math.floor で整数にする（| 0 だと桁あふれして負になる）
  const swing = Math.floor(now * 4) % 2, cx = h.x + 18, cy = h.y + 3;
  g.drawImage(personSpr('#ffd84a', '#4a7fd4', swing), cx, cy);
  g.fillStyle = '#6b4a2a'; g.fillRect(cx - 1, cy + 6 - swing * 2, 1, 3);
  g.fillStyle = '#9a9aa2'; g.fillRect(cx - 2, cy + 5 - swing * 2, 3, 1);
  if (swing) { g.fillStyle = '#ffe14a'; g.fillRect(cx - 4, cy + 4, 1, 1); g.fillRect(cx - 3, cy + 2, 1, 1); }
}
// 建ったあと少しのあいだ、きらきらさせる
function drawSparkle(g, h, now){
  const t = now - h.builtAt;
  if (t > 3) { h.builtAt = null; return; }
  g.fillStyle = `rgba(255,240,150,${(1 - t / 3).toFixed(2)})`;
  for (let i = 0; i < 6; i++) {
    const an = i / 6 * Math.PI * 2 + t * 2, rr = 9 + t * 3;
    g.fillRect(Math.round(h.x + 8 + Math.cos(an) * rr), Math.round(h.y + 7 + Math.sin(an) * rr * .7), 1, 1);
  }
}

// 時刻ごとのかぶせる色 [時, r, g, b, 濃さ]
const SKY_KEYS = [[0,16,24,70,.55],[4.5,16,24,70,.55],[5.5,110,80,150,.35],[6.5,255,170,120,.18],[7.5,0,0,0,0],
  [16,0,0,0,0],[17,255,140,60,.2],[18,200,90,90,.3],[19,40,40,110,.5],[20,16,24,70,.55],[24,16,24,70,.55]];
const SKY_FIXED = {day:12, evening:17.6, night:22};
function skyTint(){
  const d = new Date(simMs);
  const hr = sky.mode === 'auto' ? d.getHours() + d.getMinutes() / 60 : SKY_FIXED[sky.mode];
  let i = 0; while (SKY_KEYS[i + 1][0] < hr) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], k = (hr - a[0]) / (b[0] - a[0] || 1);
  const mix = j => a[j] + (b[j] - a[j]) * k;
  // 昼から色がつくとき・消えるときは、色そのものは相手側を使う
  const pick = a[4] === 0 ? b : b[4] === 0 ? a : null;
  const rgb = pick ? [pick[1], pick[2], pick[3]] : [mix(1), mix(2), mix(3)];
  return {r:rgb[0] | 0, g:rgb[1] | 0, b:rgb[2] | 0, a:mix(4), dark: mix(4) > .3 && (hr >= 18 || hr < 6.5)};
}

function drawSnow(g){
  const t = performance.now(), dt = Math.min(.1, (t - lastFlake) / 1000); lastFlake = t;
  g.fillStyle = 'rgba(255,255,255,.9)';
  for (const f of flakes) {
    f.y += f.v * dt; f.x += Math.sin(t / 900 + f.p) * 4 * dt;
    if (f.y > H) { f.y = -2; f.x = R() * W; }
    if (f.x < 0) f.x += W; if (f.x > W) f.x -= W;
    g.fillRect(f.x | 0, f.y | 0, f.s, f.s);
  }
}

    } else if (kind === 'crawler') {
      a.spd = 34; a.bot = pick(['Googlebot','Bingbot','GPTBot','ClaudeBot','PerplexityBot']);
      a.route = Array.from({length: 4 + (R() * 4 | 0)}, () => pick(PAGES));
      stats.bots++; curHour().bots++;
    } else if (kind === 'spam') {
      a.spd = 30; a.route = [TOP, FORM]; a.letter = true; stats.bots++; curHour().bots++;
    } else if (kind === 'attacker') {
      a.spd = 42; a.route = [PIT, PIT, PIT, ADMIN, PIT, ADMIN, ADMIN]; a.tag = '下見';
      a.uaNames = 1; a.loginTries = 0;
      stats.attacks++;
      const s = {agent:a, ip:a.ip, tag:'下見', hits:0, banned:false, first:clock()};
      suspects.unshift(s); a.suspect = s;
      log(`攻撃の疑い：${a.ip} が来ました（存在しないページを探しています）`, 'bad');
      renderSuspects();
    }
    a.wp = route(a, doorSpot(a.route[0]));
    agents.push(a);
    return a;
  },
  arrive(a){
    const h = a.route[a.step];
    a.at = h; h.viewers++; h.total += a.kind === 'human' ? 1 : 0;
    a.history.push(h);
    a.pageLog.push({h, t:simS(), dur:null});
    if (a.kind === 'attacker') {
      const n = 3 + (R() * 9 | 0);
      a.reqs += n;
      if (h === PIT) a.notFound += n; else a.loginTries += n;
      a.uaNames += R() * 3 | 0;
    } else { a.reqs++; if (h === PIT) a.notFound++; }
    if (a.kind === 'human') { stats.views++; if (h === PIT) log(`お客さん${a.id} がリンク切れで迷子の穴に落ちました`); else if (h === FORM) log(`お客さん${a.id} がお問い合わせフォームを開きました`); else if (R() < .35) log(`お客さん${a.id} が「${h.name}」を見ています`); }
    if (a.kind === 'spam' && h === FORM) { a.letter = false; log(`フォーム営業ロボット(${a.ip})が手紙を投函しました`, 'bad'); }
    if (a.kind === 'attacker') {
      a.suspect.hits++;
      if (h === ADMIN && a.tag !== '侵入?') {
        a.tag = a.suspect.tag = '侵入?';
        log(`【至急】${a.ip} がログイン画面で総当たりを試しています`, 'bad');
      }
      renderSuspects();
    }
    const dur = a.kind === 'human' ? (h === PIT ? 1.5 : rand(3, 9)) : a.kind === 'attacker' ? .5 : a.kind === 'crawler' ? .6 : 2.5;
    a.state = 'stay'; a.stayUntil = simS() + dur;
  },
  depart(a){
    const h = a.at; h.viewers--; a.at = null;
    const pl = a.pageLog[a.pageLog.length - 1]; if (pl) pl.dur = simS() - pl.t;
    const nx = a.route[a.step + 1];
    if (nx && a.kind === 'human') h.next[nx.name] = (h.next[nx.name] || 0) + 1;
    a.step++;
    if (nx) { a.state = 'walk'; a.wp = route(a, doorSpot(nx)); }
    else { a.state = 'leave'; a.wp = route(a, GATE.door); }
  },
  // デモでは、始まってしばらくすると新しいページが公開されて家が建つ
  started: null,
  tick(dt){
    Demo.started ??= simS();
    if (!Demo.published && simS() - Demo.started > 10) {
      Demo.published = true;
      Demo.zones.find(z => z.name === 'サービス').pages.push({title:'AIセミナー開催', path:'/service/seminar', fresh:true});
      layoutTown(Demo.zones, {pit:true, animateNew:true});
      log('新しいページが公開されました：「AIセミナー開催」');
    }
    const c = Demo.clock;
    c.human -= dt; c.crawler -= dt; c.spam -= dt; c.attacker -= dt;
    if (c.human <= 0) { Demo.spawn('human'); c.human = rand(1.2, 3.2); }
    if (c.crawler <= 0) { Demo.spawn('crawler'); c.crawler = rand(6, 12); }
    if (c.spam <= 0) { Demo.spawn('spam'); c.spam = rand(25, 45); }
    if (c.attacker <= 0) { Demo.spawn('attacker'); c.attacker = rand(40, 70); }
  },
};

// ============================================================
// 実データ（収集サーバーの /api）
// ============================================================
const SESSION_GAP = 30 * 60;   // 30分なにもなければ帰ったとみなす
const LEAVE_GRACE = 10;        // 「離れた」のあと、次のページを待つ秒数
const Live = {
  key: (() => { try { return localStorage.getItem('dtm_key') || ''; } catch { return ''; } })(),
  lastId: 0,
  seq: 0,
  sessions: new Map(),      // セッション → 町にいる小人
  seenSessions: new Map(),  // きょう来たセッション → 種類（人数の集計用）
  firstSeen: new Map(),     // セッション → 最初のイベント（来訪元はここから取る）
  dayStart: new Date(new Date().setHours(0, 0, 0, 0)).getTime(),
  // 通信の失敗には net:true を付け、画面の処理で起きたエラーと分ける。
  // スリープ明けなどに応答が返らないまま止まらないよう、15秒で打ち切る
  async api(path){
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let res;
    try { res = await fetch(path, {headers: {'x-passcode': Live.key}, signal: ctl.signal, cache: 'no-store'}); }
    catch (e) { throw Object.assign(new Error('通信できません（' + (e.name === 'AbortError' ? '15秒応答なし' : e.message) + '）'), {net: true}); }
    finally { clearTimeout(timer); }
    if (res.status === 401) throw Object.assign(new Error('unauthorized'), {auth: true});
    if (!res.ok) throw Object.assign(new Error('収集サーバーのエラー（HTTP ' + res.status + '）'), {net: true});
    try { return await res.json(); } catch (e) { throw Object.assign(new Error('応答が途中で切れました'), {net: true}); }
  },
  // 画面の処理で起きたエラーは、通信エラーとは別に記録へ出す（原因を追えるように）
  reportBug(e){
    console.error(e);
    const msg = `画面の処理でエラーが起きました：${e && e.message || e}`;
    if (Live.lastBug !== msg) log(msg, 'bad');
    Live.lastBug = msg;
  },
  async start(){
    try {
      const town = await Live.api('/api/town');
      // きょうの分を、多いときは何回かに分けて読む
      let {events} = await Live.api(`/api/events?from=${Live.dayStart}&limit=5000`);
      for (let more = events; more.length === 5000;) {
        more = (await Live.api(`/api/events?after=${more[more.length - 1].id}&limit=5000`)).events;
        events = events.concat(more);
      }
      townInfo = town;
      $('siteUrl').textContent = town.site.origin.replace(/^https?:\/\//, '') + '（計測タグ）';
      document.title = `${town.site.name} | ドット町モニター`;
      Live.buildTown(town, events);
      for (const ev of events) Live.handle(ev, false);
      // 読み込んだ時点で30分以上動きのない人は、もう帰っている
      for (const a of agents.slice()) if (simS() - a.lastEvent > SESSION_GAP || (a.leaveAt && a.leaveAt <= simS())) Live.remove(a);
      log(`監視をはじめました（きょうのイベント ${events.length}件を読み込み）`);
      renderSide(); renderSuspects();
      Live.setStatus(true);
      Live.schedule();
      // 画面に戻ったとき・ネットワークが戻ったときは、すぐ取りにいく
      document.addEventListener('visibilitychange', () => { if (!document.hidden) Live.schedule(0); });
      addEventListener('online', () => Live.schedule(0));
      Live.refreshTimer ||= setInterval(() => Live.refreshTown().catch(() => {}), 10 * 60 * 1000);
    } catch (e) {
      if (e.auth) return askKey(Live.key ? '合言葉がちがいます' : '');
      if (!e.net) return Live.reportBug(e);
      console.error(e);
      Live.setStatus(false, e.message);
      setTimeout(Live.start, 15000);
    }
  },
  // 取りにいく間隔。見ているときは5秒、画面が隠れているときは1分。
  // 失敗したらすぐ（5秒後に）やり直し、3回続けて失敗したら「接続できません」にして30秒ごとに試す
  timer: null,
  schedule(ms){
    clearTimeout(Live.timer);
    const wait = ms ?? (!Live.ok ? 30000 : Live.fails ? 5000 : document.hidden ? 60000 : 5000);
    Live.timer = setTimeout(async () => { await Live.poll(); Live.schedule(); }, wait);
  },
  ok: true,
  fails: 0,
  lastOk: Date.now(),
  setStatus(ok, why){
    const changed = ok !== Live.ok, downSince = Live.lastOk;
    Live.ok = ok;
    if (ok) { Live.lastOk = Date.now(); Live.fails = 0; }
    const m = $('mode');
    m.textContent = ok ? 'ライブ' : '接続できません';
    m.classList.toggle('live', ok); m.classList.toggle('down', !ok);
    m.title = ok ? '' : `最後につながった時刻: ${new Date(Live.lastOk).toTimeString().slice(0, 5)}${why ? '／' + why : ''}`;
    if (!changed) return;
    if (ok) log(`収集サーバーに再びつながりました（約${Math.max(1, Math.round((Date.now() - downSince) / 60000))}分 途切れていました）`);
    else log(`収集サーバーにつながりません：${why || ''}。この画面の通信が切れているか、計測が止まっている可能性があります`, 'bad');
  },
  // 1回の失敗では表示を変えない（スリープ明けや Wi-Fi の切り替えで一瞬切れることがあるため）
  netFail(e){
    console.warn(e.message);
    Live.fails++;
    if (Live.fails >= 3) Live.setStatus(false, e.message);
  },
  // live = 町を見ている最中の作り直し。家の位置はなるべく変えず、新しいページは家を建てる
  buildTown(town, events, live = false){
    const views = {};
    for (const e of events) if (e.type === 'page_view' && e.kind === 'human') views[e.path] = (views[e.path] || 0) + 1;
    const byViews = (a, b) => (b.fresh - a.fresh) || (views[b.path] || 0) - (views[a.path] || 0) || a.title.localeCompare(b.title, 'ja');
    const zones = town.zones.map(name => ({name, pages: town.pages.filter(p => p.zone === name)}));
    const prevZone = new Map(ZONES.map((z, i) => [z.name, i]));
    if (live && prevZone.size) zones.sort((a, b) => (prevZone.get(a.name) ?? 99) - (prevZone.get(b.name) ?? 99));
    else zones.sort((a, b) => b.pages.length - a.pages.length);   // ページの多い区画を広い場所へ
    const prevIdx = new Map(), prevRest = new Set();
    for (const h of HOUSES) {
      if (h.path.startsWith('rest:')) h.paths.forEach(p => prevRest.add(p));
      else if (h.zone) prevIdx.set(h.path, h.order);
    }
    zones.forEach((z, zi) => {
      if (!live || !prevIdx.size) { z.pages.sort(byViews); return; }
      const cap = SLOTS[zi] ? SLOTS[zi].cols * SLOTS[zi].rows : 0;
      const visibleCap = z.pages.length > cap ? cap - 1 : cap;
      const old = z.pages.filter(p => prevIdx.has(p.path)).sort((a, b) => prevIdx.get(a.path) - prevIdx.get(b.path));
      const rest = z.pages.filter(p => prevRest.has(p.path)).sort(byViews);
      const added = z.pages.filter(p => !prevIdx.has(p.path) && !prevRest.has(p.path)).sort(byViews);
      // 新しいページには必ず家を建てる。入りきらなければ、いちばん後ろの家を「ほか」にまわす
      const room = Math.max(0, visibleCap - added.length);
      z.pages = [...old.slice(0, room), ...added, ...old.slice(room), ...rest];
    });
    layoutTown(zones, {animateNew: live});
  },
  // 町のつくりを取り直し、新しいページがあれば家を建てる（10分ごと、と知らないページが来たとき）
  async refreshTown(){
    const town = await Live.api('/api/town');
    if (!town.pages.some(p => p.path !== town.top && !houseByPath.has(p.path))) return;
    townInfo = town;
    const was = new Map(HOUSES.map(h => [h, h.x + ',' + h.y]));
    const counts = HOUSES.flatMap(h => Array(h.total).fill({type:'page_view', kind:'human', path:h.path}));
    Live.buildTown(town, counts, true);
    // 位置が変わった家の前にいた小人は、新しい位置へ移す
    for (const a of agents) if (a.at && was.get(a.at) !== a.at.x + ',' + a.at.y) { const s = doorSpot(a.at); a.x = s.x; a.y = s.y; }
  },
  polling: false,
  // 区画のルールに当てはまらないページ（サーバーが家にしないもの）は、町を作り直さずにトップへ寄せる
  unknownTried: new Set(),
  async poll(){
    if (Live.polling) return;
    Live.polling = true;
    try {
      const {events} = await Live.api(`/api/events?after=${Live.lastId}`);
      Live.setStatus(true);
      // まだ町にないページが出てきたら、サーバーが家にしたページだけを足して町を作り直す。
      // 区画のルールに当てはまらないページは家にせず、トップの前に立たせる
      const unknown = [...new Set(events.filter(e => (e.type === 'page_view' || e.type === 'page_resume') && !houseByPath.has(e.path)).map(e => e.path))]
        .filter(p => !Live.unknownTried.has(p));
      if (unknown.length) {
        unknown.forEach(p => Live.unknownTried.add(p));
        await Live.refreshTown();
      }
      // 1件の処理でつまずいても、残りのイベントは続けて処理する
      for (const ev of events) {
        try { Live.handle(ev, true); } catch (e) { Live.lastId = Math.max(Live.lastId, ev.id); Live.reportBug(e); }
      }
    } catch (e) {
      if (e.auth) askKey('合言葉がちがいます');
      else if (e.net) Live.netFail(e);
      else Live.reportBug(e);
    } finally { Live.polling = false; }
  },
  houseFor(path){ return houseByPath.get(path) || TOP; },
  handle(ev, animate){
    Live.lastId = Math.max(Live.lastId, ev.id);
    const t = ev.ts / 1000;
    const isHuman = ev.kind === 'human';
    const newSession = !Live.firstSeen.has(ev.session);
    if (newSession) Live.firstSeen.set(ev.session, ev);
    if (ev.ts >= Live.dayStart && !Live.seenSessions.has(ev.session)) {
      Live.seenSessions.set(ev.session, ev.kind);
      const hb = hourly[new Date(ev.ts).getHours()] ||= {humans:0, bots:0};
      if (isHuman) { stats.humans++; hb.humans++; } else { stats.bots++; hb.bots++; }
    }
    let a = Live.sessions.get(ev.session);
    // page_resume は別のタブから戻ってきただけ。小人は動かすが、閲覧数には数えない
    if (ev.type === 'page_view' || ev.type === 'page_resume') {
      const h = Live.houseFor(ev.path);
      if (ev.type === 'page_view' && isHuman && ev.ts >= Live.dayStart) { stats.views++; h.total++; }
      if (!a) {
        a = Live.spawn(ev);
        if (animate && isHuman && newSession) log(`お客さん${a.id} が来ました（${a.src.key === 'direct' ? '直接' : a.referrer + 'から'}・${a.mobile ? 'スマホ' : 'パソコン'}）`);
        if (animate && ev.kind === 'crawler' && newSession) log(`${a.bot} が巡回に来ました`);
      }
      a.lastEvent = t; a.leaveAt = null;
      if (ev.type === 'page_view') a.reqs++;
      if (h !== a.at || a.state === 'walk') Live.moveTo(a, h, t, animate);
    } else if (ev.type === 'page_leave') {
      if (!a) return;
      a.lastEvent = t;
      const pl = a.pageLog[a.pageLog.length - 1];
      if (pl && pl.dur == null && ev.dwell_ms != null) pl.dur = ev.dwell_ms / 1000;
      // ページごとに読み込み直すサイトでは、次のページの前にも「離れた」が届く。少し待ってから帰らせる
      if (ev.final) a.leaveAt = (animate ? simS() : t) + LEAVE_GRACE;
    } else if (ev.type === 'form_submit') {
      if (ev.kind === 'spam') {
        if (a) a.kind = 'spam';
        if (animate) log(`フォーム営業ロボットらしい送信がありました（${ev.ip || 'IP不明'}）`, 'bad');
      } else if (animate) log(`お客さん${a ? a.id : ''} がお問い合わせを送信しました！`, 'good');
      if (a) a.lastEvent = t;
    }
  },
  spawn(ev){
    // 町を一度出て戻ってきた人も、来訪元は最初に来たときのもの
    const first = Live.firstSeen.get(ev.session) || ev;
    ev = {...ev, src: first.src, src_name: first.src_name};
    const a = newAgent(ev.kind === 'human' ? 'human' : ev.kind === 'spam' ? 'spam' : 'crawler', {
      id: ++Live.seq, live: true, session: ev.session, ip: ev.ip || '—',
      src: srcByKey(ev.src), referrer: ev.src_name || 'なし（ブックマーク・URL直接）',
      visits: ev.visits || 1, returning: (ev.visits || 1) > 1, mobile: ev.device === 'スマホ',
      browser: [ev.os, ev.browser].filter(Boolean).join(' '), device: ev.device, bot: ev.bot || 'ロボット',
      spd: ev.kind === 'human' ? rand(16, 22) : 34, lastEvent: ev.ts / 1000,
    });
    a.born = ev.ts / 1000;
    Live.sessions.set(ev.session, a);
    agents.push(a);
    return a;
  },
  moveTo(a, h, t, animate){
    // 前のページの家に着く前に次のページへ移った場合も、見たページとして記録する
    if (a.state === 'walk' && a.route[a.step] && a.pendingT != null) {
      const skipped = a.route[a.step];
      a.history.push(skipped);
      a.pageLog.push({h: skipped, t: a.pendingT, dur: Math.max(0, t - a.pendingT)});
      if (a.kind === 'human') skipped.next[h.name] = (skipped.next[h.name] || 0) + 1;
    }
    Live.leaveHouse(a, t);
    a.route.push(h); a.step = a.route.length - 1; a.pendingT = t;
    if (animate) { a.state = 'walk'; a.wp = route(a, doorSpot(h)); }
    else { const s = doorSpot(h); a.x = s.x; a.y = s.y; a.wp = []; Live.arrive(a); }
  },
  leaveHouse(a, t){
    if (!a.at) return;
    const pl = a.pageLog[a.pageLog.length - 1];
    if (pl && pl.dur == null) pl.dur = Math.max(0, t - pl.t);
    a.at.viewers--;
    const nx = a.route[a.step + 1];
    if (nx && a.kind === 'human') a.at.next[nx.name] = (a.at.next[nx.name] || 0) + 1;
    a.prevHouse = a.at; a.at = null;
  },
  arrive(a){
    const h = a.route[a.step];
    if (a.prevHouse && a.kind === 'human') a.prevHouse.next[h.name] = (a.prevHouse.next[h.name] || 0) + 1;
    a.prevHouse = null;
    a.at = h; h.viewers++;
    a.history.push(h);
    a.pageLog.push({h, t: a.pendingT ?? simS(), dur: null});
    a.state = 'stay'; a.stayUntil = Infinity;
  },
  startLeave(a){
    Live.leaveHouse(a, simS());
    Live.sessions.delete(a.session);
    a.state = 'leave'; a.leaveAt = null; a.wp = route(a, GATE.door);
  },
  remove(a){
    Live.leaveHouse(a, a.lastEvent);
    Live.sessions.delete(a.session);
    const i = agents.indexOf(a); if (i >= 0) agents.splice(i, 1);
    if (selected === a) closePop();
  },
  tick(){
    const now = simS();
    for (const a of agents) {
      if (a.state !== 'stay') continue;
      if ((a.leaveAt && now >= a.leaveAt) || now - a.lastEvent > SESSION_GAP) Live.startLeave(a);
    }
    if (Date.now() - Live.dayStart > 86400000) location.reload();
  },
};

// ===== 動き =====
function update(dt){
  if (DEMO) Demo.tick(dt); else Live.tick();
  const now = simS();
  for (let i = agents.length - 1; i >= 0; i--) {
    const a = agents[i];
    if (a.gone) { if (now - a.gone > .8) agents.splice(i, 1); continue; }
    if (a.state === 'stay') { if (DEMO && now >= a.stayUntil) Demo.depart(a); continue; }
    const t = a.wp[0];
    if (!t) {
      if (a.state === 'leave') { agents.splice(i, 1); if (selected === a) closePop(); }
      else if (a.live) Live.arrive(a); else Demo.arrive(a);
      continue;
    }
    const dx = t.x - a.x, dy = t.y - a.y, d = Math.hypot(dx, dy), st = a.spd * dt;
    if (d <= st) { a.x = t.x; a.y = t.y; a.wp.shift(); } else { a.x += dx / d * st; a.y += dy / d * st; }
    a.walked += Math.min(d, st);
    a.ft += dt; if (a.ft > .16) { a.ft = 0; a.f ^= 1; }
    if (a.kind === 'human' && a.walked - a.lastFoot >= 3) {
      a.lastFoot = a.walked;
      const side = (a.walked / 3 | 0) % 2 ? 1 : -1;
      foots.push({x: Math.round(a.x + (Math.abs(dy) > Math.abs(dx) ? side : 0)), y: Math.round(a.y + (Math.abs(dx) >= Math.abs(dy) ? side : 0)), t: now});
    }
  }
  while (foots.length && now - foots[0].t > footLife()) foots.shift();
  if (foots.length > 5000) foots.splice(0, foots.length - 5000);
  for (let i = puffs.length - 1; i >= 0; i--) if (now - puffs[i].t > 1.2) puffs.splice(i, 1);
}

// ===== 描画 =====
const cv = $('stage'), ctx = cv.getContext('2d');
const world = document.createElement('canvas'); world.width = W; world.height = H;
const wg = world.getContext('2d');
let S = 2, ox = 0, oy = 0, dpr = 1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const fit = Math.min(cv.width / W, cv.height / H);
  // 整数倍だと余白が大きくなりすぎるときは画面いっぱいに合わせる
  S = Math.floor(fit) / fit > .88 ? Math.floor(fit) : fit;

// 雪の上の足あとは濃く、長く残る
const footLife = () => drawnGround === 'snow' ? 240 : 90;
function drawWorld(){
  const now = simS(), g = wg;
  // 季節や雪の設定が変わったら（日付が変わったときも）背景を描き直す
  if (groundKey() !== drawnGround) drawBackground();
  const snow = drawnGround === 'snow', life = footLife();
  g.drawImage(bg, 0, 0);
  for (const f of foots) {
    const al = Math.max(0, 1 - (now - f.t) / life);
    g.fillStyle = snow ? `rgba(78,96,140,${(.8 * al).toFixed(2)})` : `rgba(92,62,30,${(.55 * al).toFixed(2)})`;
    g.fillRect(f.x, f.y, 1, 1);
  }
  for (const h of HOUSES) { if (h.building) drawBuilding(g, h, now); else if (h.builtAt) drawSparkle(g, h, now); }
  if (CGI) for (let i = 0; i < 3; i++) {
    const p = ((now * .6 + i / 3) % 1);
    g.fillStyle = `rgba(230,230,235,${(1 - p).toFixed(2)})`;
    g.fillRect(CGI.x + 12 + Math.round(Math.sin(p * 6 + i) * 1.5), CGI.y - 2 - Math.round(p * 9), 2, 2);
  }
  if ((now * 2 | 0) % 2) { g.fillStyle = GROUND[drawnGround].grass; g.fillRect(TOP.x + 20, TOP.y + 3, 1, 1); g.fillStyle = '#e8443a'; g.fillRect(TOP.x + 21, TOP.y + 1, 1, 2); }

  const list = agents.slice().sort((p, q) => p.y - q.y);
  for (const a of list) {
    const x = Math.round(a.x - 4), y = Math.round(a.y - 11);
    const f = a.state === 'walk' || a.state === 'leave' ? a.f : 0;
    if (a === selected) { g.fillStyle = '#ffe14a'; g.fillRect(x - 1, y + 11, 11, 2); }
    g.globalAlpha = a.gone ? Math.max(0, 1 - (now - a.gone) / .8) : a.kind === 'crawler' ? .55 : 1;
    if (a.kind === 'human') g.drawImage(personSpr(a.src.color, a.returning ? RETURN_CLOTHES : CLOTHES, f), x, y);
    else if (a.kind === 'crawler') g.drawImage(robotSpr('#a9bccf', '#3cf', f), x, y + 1);
    else if (a.kind === 'spam') { g.drawImage(robotSpr('#e5c34a', '#e33', f), x, y + 1); if (a.letter) g.drawImage(envSpr, x + 6, y + 5); }
    else if (a.kind === 'attacker') {
      g.drawImage(hoodSpr(f), x, y);
      if ((now * 3 | 0) % 2) { g.fillStyle = INK; g.fillRect(x + 3, y - 7, 3, 6); g.fillStyle = '#ffe14a'; g.fillRect(x + 4, y - 6, 1, 3); g.fillRect(x + 4, y - 2, 1, 1); }
    }

    g.fillStyle = `rgba(255,255,255,${(1 - k).toFixed(2)})`;
    for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2; g.fillRect(Math.round(p.x + Math.cos(an) * r), Math.round(p.y - 6 + Math.sin(an) * r * .6), 2, 2); }
  }
  if (snow) drawSnow(g);

  const tint = skyTint();
  if (tint.a > 0) { g.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},${tint.a.toFixed(2)})`; g.fillRect(0, 0, W, H); }
  if (tint.dark) {
    // 夜は街灯と、人が見ている家の窓に明かりがつく
    for (const [x, y] of LAMPS) {

      for (let r = 2; r <= 6; r += 2) { g.beginPath(); g.ellipse(x + .5, y, r * 1.4, r, 0, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = '#ffe58a'; g.fillRect(x - 1, y - 6, 3, 1);
    }
    g.fillStyle = '#ffe58a';
    for (const h of HOUSES) if (h.viewers > 0 && h.type !== 'mansion' && h.type !== 'pit' && !h.building) { g.fillRect(h.x + 3, h.y + 8, 2, 2); g.fillRect(h.x + 11, h.y + 8, 2, 2); }
    if (TOP.viewers > 0) for (const wx of [4, 9, 18, 23]) g.fillRect(TOP.x + wx, TOP.y + 19, 3, 3);
  }
}

// 家の名前は家と家の間に収まる幅で切る（label と同じ文字の大きさで測る）
function fitName(s, maxW){

function render(){

const tl = $('timeline'), tg = tl.getContext('2d');

  const next = Object.entries(h.next).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const inside = h.titles ? `<div class="meta" style="margin:6px 0 2px">まとめているページ</div><div class="pages">${h.titles.map(t => `<div class="pl next">${esc(t)}</div>`).join('')}</div>` : '';
  $('popBody').innerHTML = `<h4>${esc(h.name)}</h4><div class="meta">${esc(h.titles ? h.zone : h.paths[0])}</div>
    <table><tr><td>いま見ている人</td><td>${agents.filter(a => a.at === h && a.kind === 'human').length}</td></tr>
    <tr><td>きょう見た回数</td><td>${h.total}</td></tr></table>
    ${next.length ? `<div class="meta" style="margin:6px 0 2px">次に行ったページ</div>${next.map(([n, c]) => `<div class="route"><span>${esc(n)}</span><i>${c}人</i></div>`).join('')}` : ''}${inside}`;
}
function closePop(){ pop.style.display = 'none'; selected = null; selectedHouse = null; popKind = null; }
$('popX').onclick = closePop;

// ===== 操作 =====
function seg(id, fn){ $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b); }); }
seg('speedSeg', b => speed = +b.dataset.x);
// 空と季節の設定はこのブラウザに覚えておく
function skySetting(key, val){
  sky[key] = val;
  try { localStorage.setItem('dtm_sky', JSON.stringify(sky)); } catch { /* 覚えられなくても今回は効く */ }
}
for (const [id, key] of [['skySeg', 'mode'], ['snowSeg', 'snow']]) {
  $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === sky[key]));
  seg(id, b => skySetting(key, b.dataset.v));
}
$('seasonSel').value = sky.season;
$('seasonSel').onchange = e => skySetting('season', e.target.value);
seg('kFilter', b => { kFilter = b.dataset.k; renderKobito(); });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }

function askKey(msg){
  $('gate').classList.add('on'); $('gateErr').textContent = msg || ''; $('gateKey').focus();
}
$('gateForm').onsubmit = e => {
  e.preventDefault();
  Live.key = $('gateKey').value.trim();
  try { localStorage.setItem('dtm_key', Live.key); } catch { /* 保存できなくても今回は使える */ }
  $('gate').classList.remove('on');
  Live.start();
};

// 凡例とロゴ
(function(){
  const items = [
    [personSpr(SOURCES[0].color, CLOTHES, 0), '検索から来た人'],
    [personSpr(SOURCES[1].color, CLOTHES, 0), '直接来た人'],
    [personSpr(SOURCES[2].color, CLOTHES, 0), 'AIチャットから'],
    [personSpr(SOURCES[3].color, CLOTHES, 0), 'SNSから'],
    [personSpr(SOURCES[4].color, CLOTHES, 0), 'ほかのサイトから'],
    [personSpr(SOURCES[0].color, RETURN_CLOTHES, 0), 'また来た人（服）'],
    [robotSpr('#a9bccf', '#3cf', 0), 'クローラー'],
    [robotSpr('#e5c34a', '#e33', 0), '営業ロボット'],
    [hoodSpr(0), '攻撃の疑い'],
  ];
  const box = $('legend');
  for (const [s, t] of items) {
    const c = document.createElement('canvas'); c.width = 9; c.height = 12; c.getContext('2d').drawImage(s, 0, 0);
    const d = document.createElement('div'); d.append(c, t); box.appendChild(d);
  }
  $('logo').getContext('2d').drawImage(personSpr('#3b6fd6', CLOTHES, 0), 0, 0);
})();

// ===== 起動 =====
$('mode').textContent = DEMO ? 'デモ' : 'ライブ';
$('mode').classList.toggle('live', !DEMO);
if (DEMO) {
  $('siteUrl').textContent = 'https://www.example.co.jp/';
  Demo.init();
} else {
  // ライブでは早送りは使わない（再生機能は次の段階）
  $('speedSeg').style.display = $('speedLbl').style.display = 'none';
  layoutTown([]);
  Live.key ? Live.start() : askKey();
}

resize();
let last = performance.now(), sideT = 0;
function loop(t){
  const real = Math.min(.1, (t - last) / 1000); last = t;
  const dt = real * (DEMO ? speed : 1);
  if (DEMO) simMs += dt * 1000; else simMs = Date.now();
  update(dt); render();
  sideT += real;
  if (sideT > .5) { sideT = 0; renderSide(); if (popKind === 'agent' && selected) fillAgentPop(); if (popKind === 'house') fillHousePop(); }
  requestAnimationFrame(loop);
}
renderSide(); renderSuspects();
requestAnimationFrame(loop);
</script>
